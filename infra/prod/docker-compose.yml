# Krevo production stack for one server. Everything lives under /opt/krevo.
#   krevoctl deploy   (uses /opt/krevo/config/.env)
# Only Caddy is reachable from the internet (ports 80 and 443). Postgres and Redis have no published ports.
name: krevo

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # The admin account is only for backups and maintenance. The API signs in as the plain `krevo` role (created by
      # `krevoctl deploy`), because a Postgres superuser skips row level security and would see every school's data.
      POSTGRES_USER: krevo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - /opt/krevo/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krevo_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:7
    restart: unless-stopped
    # Redis only holds short-lived data (sign-in lockouts, rate limits), so no persistence is needed.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ../../apps/api
    image: krevo-api:latest
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    env_file: /opt/krevo/config/.env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://krevo:${APP_DB_PASSWORD}@db:5432/krevo
      REDIS_URL: redis://redis:6379/0
    expose: ["8000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.krevo.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/krevo/data/caddy:/data
