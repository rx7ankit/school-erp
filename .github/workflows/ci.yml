name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://krevo_test:krevo@localhost:5432/krevo_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true, cache-dependency-glob: apps/api/uv.lock}
      - name: "Database role (a normal one like production, a superuser would skip row level security)"
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "create role krevo_test login password 'krevo' nosuperuser nobypassrls createdb" \
            -c "create database krevo_test owner krevo_test"
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @krevo/tokens build
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web exec eslint src
      - run: pnpm --filter landing exec tsc --noEmit
