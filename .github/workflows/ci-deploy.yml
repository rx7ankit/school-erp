name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the tests (first deploy or emergency)"
        type: boolean
        default: false

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: krevo, POSTGRES_PASSWORD: krevo, POSTGRES_DB: krevo_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krevo" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://krevo:krevo@localhost:5432/krevo_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true, cache-dependency-glob: apps/api/uv.lock}
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @krevo/tokens build
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web exec eslint src
      - run: pnpm --filter landing exec tsc --noEmit

  deploy:
    # Only after a push to main (or a manual run), and only if the checks passed or were skipped on purpose.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.web-checks.result == 'success' && (needs.api-tests.result == 'success' || needs.api-tests.result == 'skipped') }}
    needs: [api-tests, web-checks]
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Is deploying set up?
        id: gate
        run: |
          if [ -n "$HOST" ] && [ -n "${{ secrets.EC2_SSH_KEY != '' && 'yes' || '' }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Deploy skipped: add the EC2_HOST and EC2_SSH_KEY secrets (docs/deploy.md)"; fi
      - name: SSH access
        if: steps.gate.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/krevo.pem
          chmod 600 ~/.ssh/krevo.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host krevo
            HostName $HOST
            User ubuntu
            IdentityFile ~/.ssh/krevo.pem
            ServerAliveInterval 30
          CFG
      - name: Copy the code to the server
        if: steps.gate.outputs.ok == 'true'
        run: |
          git rev-parse --short HEAD > VERSION
          ssh krevo 'sudo mkdir -p /opt/krevo/repo && sudo chown -R ubuntu:ubuntu /opt/krevo'
          rsync -az --delete -e ssh \
            --include='/apps/' --include='/apps/api/***' --include='/infra/' --include='/infra/prod/***' --include='/VERSION' \
            --exclude='*' ./ krevo:/opt/krevo/repo/
      - name: Set up the server (first time) and deploy
        if: steps.gate.outputs.ok == 'true'
        run: |
          ssh krevo "if command -v krevoctl >/dev/null; then krevoctl deploy; else sudo BFF_SECRET='${{ secrets.BFF_SECRET }}' bash /opt/krevo/repo/infra/prod/bootstrap.sh; fi"
