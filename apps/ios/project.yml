name: Krevo
options:
  bundleIdPrefix: tech.krevo
  developmentLanguage: en
  knownRegions:
    - en
    - hi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Krevo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Krevo
        excludes:
          - Info.plist
          - Krevo.entitlements
          - "Resources/Fonts/.gitkeep"
    info:
      path: Krevo/Info.plist
      properties:
        CFBundleDisplayName: Krevo
        UIUserInterfaceStyle: Light
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - hi
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        ITSAppUsesNonExemptEncryption: false
        KrevoAPIBase: $(KREVO_API_BASE)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Krevo/Krevo.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.krevo.app
        PRODUCT_NAME: Krevo
        DEVELOPMENT_TEAM: X2Z47485TC
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty means production (https://api.krevo.tech). Override to test against a server on this Mac:
        #   xcodebuild ... KREVO_API_BASE=http://127.0.0.1:8000/api/v1
        KREVO_API_BASE: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
